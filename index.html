<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ΨΗΦΙΑΚΕΣ ΔΕΞΙΟΤΗΤΕΣ ΚΟΙΝΩΝΙΚΗΣ ΔΙΚΤΥΩΣΗΣ ΜΕ ΕΦΑΡΜΟΓΕΣ ΣΤΟΝ ΧΩΡΟ ΕΡΓΑΣΙΑΣ</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #f5f8fc 0%, #e2eaf7 100%);
      color: #003366;
      text-align: center;
      padding: 40px 10px;
      margin: 0;
      overflow-x: hidden;
    }

    h1 {
      font-size: 1.8em;
      margin-bottom: 10px;
      padding: 0 10px;
    }

    p {
      font-size: 1em;
      color: #334;
      padding: 0 10px;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .chapter {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 300px;
    }

    .chapter button {
      text-decoration: none;
      background: #1976d2;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      transition: background 0.3s, transform 0.2s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
      flex: 1;
      text-align: center;
      min-width: 100px;
      border: none;
      cursor: pointer;
    }

    .chapter button:hover {
      background: #0d47a1;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 40px;
      font-size: 0.85em;
      color: #666;
    }

    /* Viewer (iframe container) */
    #viewerContainer {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.98);
      z-index: 999;
    }

    #viewerContainer iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #closeBtn {
      position: absolute;
      top: 12px;
      right: 14px;
      background: #0d47a1;
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      z-index: 1000;
    }

    #closeBtn:hover {
      background: #c62828;
    }

    @media (max-width: 600px) {
      .chapter {
        max-width: 90%;
        gap: 8px;
      }
      .chapter button {
        font-size: 14px;
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>

  <h1>ΨΗΦΙΑΚΕΣ ΔΕΞΙΟΤΗΤΕΣ ΚΟΙΝΩΝΙΚΗΣ ΔΙΚΤΥΩΣΗΣ ΜΕ ΕΦΑΡΜΟΓΕΣ ΣΤΟΝ ΧΩΡΟ ΕΡΓΑΣΙΑΣ</h1>
  <p>Επίλεξε κεφάλαιο για να ξεκινήσεις το τεστ ή να δεις τη θεωρία:</p>

  <div class="menu">
    <div class="chapter">
      <button onclick="openViewer('https://forms.gle/9V56jdW828E2BKsQ6')">Κεφ1. Τέστ</button>
      <button onclick="openViewer('enotita1.html')">Κεφ1. Θεωρία</button>
    </div>

    <div class="chapter">
      <button onclick="openViewer('https://forms.gle/nKazNVMhZBYfNB1T7')">Κεφ2. Τέστ</button>
      <button onclick="openViewer('enotita2.html')">Κεφ2. Θεωρία</button>
    </div>

    <div class="chapter">
      <button onclick="openViewer('https://forms.gle/4toC6ticLVq2kgDa7')">Κεφ3. Τέστ</button>
      <button onclick="openViewer('enotita3.html')">Κεφ3. Θεωρία</button>
    </div>

    <div class="chapter">
      <button onclick="openViewer('https://forms.gle/vNaUHrSQ8QvpVaTM8')">Κεφ4. Τέστ</button>
      <button onclick="openViewer('enotita4.html')">Κεφ4. Θεωρία</button>
    </div>

    <div class="chapter">
      <button onclick="openViewer('https://forms.gle/5y1yR3UkxaXF8DT6A')">Κεφ5. Τέστ</button>
      <button onclick="openViewer('enotita5.html')">Κεφ5. Θεωρία</button>
    </div>

    <div class="chapter">
      <button onclick="openViewer('https://forms.gle/dXDwj32csD6krg5eA')">Κεφ6. Τέστ</button>
      <button onclick="openViewer('enotita6.html')">Κεφ6. Θεωρία</button>
    </div>

    <div class="chapter">
      <button onclick="openViewer('https://www.youtube.com/watch?v=sWO4LvUm5HA')">Βίντεο 1</button>
      <button onclick="openViewer('https://www.youtube.com/watch?v=pbsmEaJaRM8')">Βίντεο 2</button>
    </div>
  </div>

  <footer>
    Εκπαιδευτικό Υλικό – Ερωτήσεις Κατανόησης - by Antarxo © 2025
  </footer>

  <div id="viewerContainer">
    <button id="closeBtn" onclick="closeViewer()">✖</button>
    <iframe
      id="viewer"
      src=""
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>

  <script>
    function toYouTubeEmbedUrl(rawUrl) {
      const urlStr = (rawUrl || "").trim();
      try {
        const u = new URL(urlStr);

        const host = u.hostname.replace(/^www\./, "");

        // youtu.be/<id>
        if (host === "youtu.be") {
          const id = u.pathname.split("/").filter(Boolean)[0];
          if (id) return `https://www.youtube.com/embed/${id}`;
        }

        // youtube.com/watch?v=<id>
        if (host === "youtube.com" || host === "m.youtube.com") {
          if (u.pathname === "/watch") {
            const id = u.searchParams.get("v");
            if (id) return `https://www.youtube.com/embed/${id}`;
          }
          // youtube.com/embed/<id>
          if (u.pathname.startsWith("/embed/")) {
            return `https://www.youtube.com${u.pathname}`;
          }
          // youtube.com/shorts/<id>
          if (u.pathname.startsWith("/shorts/")) {
            const id = u.pathname.split("/").filter(Boolean)[1];
            if (id) return `https://www.youtube.com/embed/${id}`;
          }
        }

        return urlStr;
      } catch (e) {
        return urlStr;
      }
    }

    function openViewer(src) {
      const cleaned = (src || "").trim();
      if (cleaned === "#" || !cleaned) return;

      const embedSrc = toYouTubeEmbedUrl(cleaned);

      document.getElementById("viewer").src = embedSrc;
      document.getElementById("viewerContainer").style.display = "block";
      window.scrollTo(0, 0);
    }

    function closeViewer() {
      document.getElementById("viewerContainer").style.display = "none";
      document.getElementById("viewer").src = "";
    }
  </script>

</body>
</html>
